[m5ups]
    driver = usbhid-ups
    port = auto
    vendorid = 0764
    productid = 0601
    pollinterval = 2
    pollfreq = 30
    desc = "CyberPower CP1600EPFC - M5 + router"
    # si el flag LB del firmware resulta poco fiable en la prueba 2: descomentar y el driver calcula LB con los umbrales de abajo
    ignorelb
    override.battery.charge.low = 30
    override.battery.runtime.low = 600
