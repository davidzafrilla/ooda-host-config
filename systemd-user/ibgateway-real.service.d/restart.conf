# David 31-ago-2026 (operativa movil): ExistingSessionDetectedAction=primaryoverride
# hace que el gateway CEDA la sesion cuando David hace login en la app IBKR.
# Restart=no para no reclamar la sesion a los 90 s y expulsarle; el reclamo
# lo hace ibgateway-real-reclaim.timer (:20/:50, 06-23h), que tambien cubre
# el cold restart dominical 22:25 (vuelve a las 22:50) y caidas normales.
# Backup anterior: restart.conf.bak-20260831
[Unit]
StartLimitIntervalSec=3600
StartLimitBurst=3

[Service]
Restart=no
RestartSec=90
