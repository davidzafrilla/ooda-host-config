[Service]
# F0.9/OBS-002 06-sep-2026: IBC exit 1100 llega como 76 (1100 mod 256). No es fallo; la unidad se reinicia igualmente.
# 28-sep-2026: 143 = SIGTERM de `systemctl restart/stop ibgateway` (ibgw-monitor por ticks congelados, health-check).
# bash lo devuelve como exit-code y systemd marcaba la unidad failed → OnFailure= → DM a David + unit_failed HIGH en el
# supervisor sin fallo real (27-sep 11:24/12:04/12:25, 28-sep 17:40; hallazgo Lex). Una parada pedida es una parada limpia.
# Si el gateway muere por un SIGTERM externo (raro) queda inactivo y ibgw-monitor lo levanta en ≤3 min.
SuccessExitStatus=76 143
RestartForceExitStatus=76
