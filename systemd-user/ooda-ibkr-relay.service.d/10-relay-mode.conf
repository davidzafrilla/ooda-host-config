# F1.12 EXE-004 — drop-in de ooda-ibkr-relay.service. Etapa 3 — enforce en 4011 y 4012. SOLO con el gateway REAL aparcado (relay_stage.sh lo comprueba).
# Se instala con scripts/corte_exec/relay_stage.sh enforce-all (copia a ~/.config/systemd/user/ooda-ibkr-relay.service.d/
# 10-relay-mode.conf — UNA sola ranura: instalar una etapa sustituye a la anterior), daemon-reload y restart del relé.
# Vuelta atrás: relay_stage.sh off (borra la ranura: vuelve el ExecStart de la unit, observe sin ACL).
# ACL decidida por David el 29-sep (P1): se recorta después con la evidencia de relay_ops_summary.py.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 scripts/corte_exec/ibkr_loopback_relay.py --acl 4011=telegram_main,telegram_kairos,telegram_inversiones --acl 4012=telegram_inversiones,telegram_cto --enforce 4011 --enforce 4012
