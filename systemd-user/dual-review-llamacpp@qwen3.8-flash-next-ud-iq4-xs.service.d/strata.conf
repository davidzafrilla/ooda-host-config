# Este modelo no lo carga llama.cpp: serve_model.py lo sirve con Strata en un contenedor (dual-review-strata).
[Unit]
Description=dual-review: modelo %i del BOSGAME (Strata en Docker)

[Service]
# docker stop da 120 s al motor para descargar el modelo; después van la última mirada al kernel y el veto
TimeoutStopSec=240
# Si el supervisor muere sin limpiar (SIGKILL, caída), el contenedor no puede quedarse con el modelo cargado. Solo
# se quita el que creó ESTE arranque de la unidad (etiqueta dual-review.invocation): si la unidad sale sin haber
# cargado nada (heavy.lock ocupado, falta memoria), no toca el contenedor de otro lanzador que esté sirviendo.
ExecStopPost=-/usr/bin/python3 -I %h/llm/dual-review/serve_model.py strata-cleanup
