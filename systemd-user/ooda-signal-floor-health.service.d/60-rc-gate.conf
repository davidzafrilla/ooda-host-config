# Exit-code gate: same pinned command; exit 2 becomes 0 only while EODHD has not yet published
# the target-session price and a later market pass remains (scripts/ops/signal_floor_rc_gate.py).
[Service]
ExecStart=
ExecStart=/usr/bin/python3 %h/nanoclaw-v2/scripts/ops/signal_floor_rc_gate.py health --passes 19:15,23:10,03:15 -- /usr/bin/python3 %h/nanoclaw-v2/data/signal-floor-followup-runtime/scripts/signal_floor_service.py health --protocol %h/nanoclaw-v2/data/signal-floor-followup-runtime/config/signal_floor_followup.json --data-dir %h/nanoclaw-v2/groups/telegram_inversiones/data --archive %h/nanoclaw-v2/data/signal-floor-followup/archive --state-dir %h/nanoclaw-v2/data/signal-floor-followup/state --ledger %h/nanoclaw-v2/data/signal-floor-followup/research_events.jsonl --env-file %h/ooda-tobe/.env
